server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Include default MIME types so CSS and JS are served with proper headers
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Serve the homepage
    location = / {
        rewrite ^ /src/pages/index.html break;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve static files directly, fallback to pages directory
    location / {
        try_files $uri $uri/ /src/pages$uri /src/pages$uri.html =404;
    }
}