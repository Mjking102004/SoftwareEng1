
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rowdy's Bookstore</title>
</head>
<body>
    <header id="site-header"></header>
    <main>
        <h1>Log In</h1>
        <p>Welcome back to Rowdy's Bookstore!</p>

        <form id="login-form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <p id="login-message" role="status"
           aria-live="polite"></p>

        <p>Don't have an account?
            <a href="/register">Create an Account</a>
        </p>
    </main>

    <script type="module" src="/src/ui/loginUI.js"></script>
    <script type="module" src="/src/ui/navigationUI.js"></script>
</body>
</html>
