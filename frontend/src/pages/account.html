
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Rowdy's Bookstore</title>
</head>
<body>
    <header id="site-header"></header>

    <main>
        <h1>My Account</h1>
        <p>View and update your account information.</p>

        <p id="account-status" role="status">
            Account information is not connected yet.
        </p>

        <h2>Personal Information</h2>

        <form id="account-form">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name"
                       autocomplete="given-name" required>
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last_name"
                       autocomplete="family-name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <button type="submit">Update Account</button>
            </div>
        </form>

        <div id="account-message" class="form-feedback"
             role="status" aria-live="polite"></div>

        <h2>Order History</h2>
        <p>Order history will be available after integration.</p>

        <p><a href="/home">Back to Bookstore</a></p>
    </main>

    <script type="module" src="/src/ui/accountUI.js"></script>
    <script type="module" src="/src/ui/navigationUI.js"></script>
</body>
</html>
