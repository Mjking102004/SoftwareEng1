
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Rowdy's Bookstore</title>
    <link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="form-page">
        <h1>Create an Account</h1>
        <p>Join Rowdy's Bookstore!</p>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name"
                       autocomplete="given-name"
                       aria-describedby="first-name-feedback" required>
                <span id="first-name-feedback" class="form-feedback"></span>
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last_name"
                       autocomplete="family-name"
                       aria-describedby="last-name-feedback" required>
                <span id="last-name-feedback" class="form-feedback"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       autocomplete="email"
                       aria-describedby="email-feedback" required>
                <span id="email-feedback" class="form-feedback"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       minlength="8" autocomplete="new-password"
                       aria-describedby="password-feedback" required>
                <span id="password-feedback" class="form-feedback"></span>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                       name="confirmPassword" autocomplete="new-password"
                       aria-describedby="confirm-password-feedback" required>
                <span id="confirm-password-feedback" class="form-feedback"></span>
            </div>

            <div class="form-group">
                <button type="submit">Create Account</button>
            </div>
        </form>

        <div id="register-message" class="form-feedback"
             role="status" aria-live="polite"></div>

        <p>Already have an account?
            <a href="/login">Log In</a>
        </p>
    </main>

    <script type="module" src="/src/ui/registerUI.js"></script>
    <script type="module" src="/src/ui/navigationUI.js"></script>
</body>
</html>
