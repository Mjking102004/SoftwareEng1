<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Rowdy's Bookstore</title>
    <link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="admin-page">
        <h1>Admin Dashboard</h1>
        <p>Manage books, users, discounts, sales, and orders.</p>

        <!-- Books -->
        <section class="admin-card">
            <h2>Books</h2>
            <form id="add-book-form" class="admin-form">

                <div class="form-group">
                    <label for="book-title">Title</label>
                    <input type="text" id="book-title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" name="author" required>
                </div>

                <div class="form-group">
                    <label for="book-price">Price</label>
                    <input type="number" id="book-price" name="price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="book-quantity">Quantity</label>
                    <input type="number" id="book-quantity" name="quantity" min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label for="book-category">Category</label>
                    <select id="book-category" name="category_id">
                        <option value="">None</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="book-image">Image URL</label>
                    <input type="text" id="book-image" name="image_url">
                </div>

                <div class="form-group">
                    <label for="book-description">Description</label>
                    <input type="text" id="book-description" name="description">
                </div>

                <div class="form-group">
                    <button type="submit" id="book-submit">Add Book</button>
                    <button type="button" id="book-cancel" hidden>Cancel</button>
                </div>
            </form>

            <p id="book-message" class="form-feedback" role="status"></p>
            <div id="admin-books"></div>
        </section>

        <!-- Users -->
        <section class="admin-card">
            <h2>Users</h2>
            <p id="user-message" class="form-feedback" role="status"></p>
            <form id="edit-user-form" class="admin-form" hidden>
                <div class="form-group">
                    <label for="user-first-name">First Name</label>
                    <input type="text" id="user-first-name" name="first_name" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="user-last-name">Last Name</label>
                    <input type="text" id="user-last-name" name="last_name" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="email" required>
                </div>

                <div class="form-group">
                    <button type="submit">Save User</button>
                    <button type="button" id="user-cancel">Cancel</button>
                </div>
            </form>

            <div id="admin-users"></div>
        </section>

        <!-- Discount Codes -->
        <section class="admin-card">
            <h2>Discount Codes</h2>
            <form id="add-discount-form" class="admin-form">
                <div class="form-group">
                    <label for="discount-code">Code</label>
                    <input type="text" id="discount-code" name="code" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="discount-percent">Percent Off</label>
                    <input type="number" id="discount-percent" name="discount_percent" min="1" max="100" step="1" required>
                </div>

                <div class="form-group">
                    <button type="submit">Add Code</button>
                </div>
            </form>

            <p id="discount-message" class="form-feedback" role="status"></p>
            <div id="admin-discounts"></div>
        </section>

        <!-- Sales -->
        <section class="admin-card">
            <h2>Sales</h2>
            <form id="add-sale-form" class="admin-form">
                <div class="form-group">
                    <label for="sale-book">Book</label>
                    <select id="sale-book" name="book_id" required></select>
                </div>

                <div class="form-group">
                    <label for="sale-price">Sale Price</label>
                    <input type="number" id="sale-price" name="sale_price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <button type="submit">Add Sale</button>
                </div>
            </form>

            <p id="sale-message" class="form-feedback" role="status"></p>

            <div id="admin-sales"></div>
        </section>

        <!-- Current Orders -->
        <section class="admin-card">
            <h2>Current Orders</h2>
            <p id="order-message" class="form-feedback" role="status"></p>
            <div id="admin-orders"></div>
        </section>

        <!-- Order History -->
        <section class="admin-card">
            <div class="admin-card-header">
                <h2>Order History</h2>
                <select id="order-sort" aria-label="Sort order history">
                    <option value="date-new">Date: Newest first</option>
                    <option value="date-old">Date: Oldest first</option>
                    <option value="customer">Customer: A to Z</option>
                    <option value="total-high">Total: High to Low</option>
                    <option value="total-low">Total: Low to High</option>
                </select>
            </div>
            <div id="admin-order-history"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rowdy's Bookstore</p>
    </footer>
    <script type="module" src="/src/ui/adminUI.js"></script>
    <script src="/src/ui/navigationUI.js"></script>
</body>
</html>
