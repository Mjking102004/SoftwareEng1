<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Rowdy's Bookstore</title>
    <link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="admin-page">
        <h1>Admin Dashboard</h1>
        <p>Manage books, users, discounts, sales, and orders.</p>

        <!-- Books -->
        <section class="admin-card">
            <h2>Books</h2>
            <div id="admin-books"></div>
        </section>

        <!-- Users -->
        <section class="admin-card">
            <h2>Users</h2>
            <div id="admin-users"></div>
        </section>

        <!-- Discount Codes -->
        <section class="admin-card">
            <h2>Discount Codes</h2>
            <div id="admin-discounts"></div>
        </section>

        <!-- Sales -->
        <section class="admin-card">
            <h2>Sales</h2>
            <div id="admin-sales"></div>
        </section>

        <!-- Orders -->
        <section class="admin-card">
            <h2>Orders</h2>
            <div id="admin-orders"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rowdy's Bookstore</p>
    </footer>

    <script src="/src/ui/navigationUI.js"></script>
</body>
</html>
