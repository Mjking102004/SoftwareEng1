<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Rowdy's Bookstore</title>
    <link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="admin-page">
        <h1>Admin Dashboard</h1>
        <p>Manage books, users, discounts, sales, and orders.</p>

        <!-- Books -->
        <section class="admin-card">
            <h2>Books</h2>
            <form id="add-book-form" class="admin-form">

                <div class="form-group">
                    <label for="book-title">Title</label>
                    <input type="text" id="book-title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" name="author" required>
                </div>

                <div class="form-group">
                    <label for="book-price">Price</label>
                    <input type="number" id="book-price" name="price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="book-quantity">Quantity</label>
                    <input type="number" id="book-quantity" name="quantity" min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label for="book-category">Category</label>
                    <select id="book-category" name="category_id">
                        <option value="">None</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="book-image">Image URL</label>
                    <input type="text" id="book-image" name="image_url">
                </div>

                <div class="form-group">
                    <label for="book-description">Description</label>
                    <input type="text" id="book-description" name="description">
                </div>

                <div class="form-group">
                    <button type="submit">Add Book</button>
                </div>
            </form>

            <p id="book-message" class="form-feedback" role="status"></p>
            <div id="admin-books"></div>
        </section>

        <!-- Users -->
        <section class="admin-card">
            <h2>Users</h2>
            <div id="admin-users"></div>
        </section>

        <!-- Discount Codes -->
        <section class="admin-card">
            <h2>Discount Codes</h2>
            <div id="admin-discounts"></div>
        </section>

        <!-- Sales -->
        <section class="admin-card">
            <h2>Sales</h2>
            <div id="admin-sales"></div>
        </section>

        <!-- Orders -->
        <section class="admin-card">
            <h2>Orders</h2>
            <div id="admin-orders"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rowdy's Bookstore</p>
    </footer>
    <script type="module" src="/src/ui/adminUI.js"></script>
    <script src="/src/ui/navigationUI.js"></script>
</body>
</html>
